<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="매매일지">
<meta name="theme-color" content="#0a0a0f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>매매일지</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

:root {
  --bg: #0a0a0f;
  --bg2: #111118;
  --bg3: #1a1a24;
  --border: #2a2a3a;
  --accent: #00d4ff;
  --accent2: #7c3aed;
  --green: #00ff88;
  --red: #ff4466;
  --yellow: #ffd700;
  --text: #e0e0f0;
  --text2: #8888aa;
  --mono: 'JetBrains Mono', monospace;
  --sans: 'Noto Sans KR', sans-serif;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { background:var(--bg); color:var(--text); font-family:var(--sans); min-height:100dvh; overflow-x:hidden; }

/* ── TOPBAR ── */
.topbar {
  position:sticky; top:0; z-index:100;
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 16px;
  background:rgba(10,10,15,0.95); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}
.topbar-title { font-family:var(--mono); font-size:15px; font-weight:700; color:var(--accent); letter-spacing:.05em; }
.topbar-sub { font-size:10px; color:var(--text2); font-family:var(--mono); }

/* ── BOTTOM NAV ── */
.bottom-nav {
  position:fixed; bottom:0; left:0; right:0; z-index:100;
  display:flex;
  background:rgba(10,10,15,0.97); backdrop-filter:blur(12px);
  border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-btn {
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:10px 0; gap:3px;
  background:none; border:none; cursor:pointer;
  color:var(--text2); font-family:var(--sans); font-size:10px;
  transition:color .2s;
}
.nav-btn.active { color:var(--accent); }
.nav-btn .icon { font-size:20px; line-height:1; }

/* ── PAGES ── */
.page { display:none; padding:12px 16px 90px; }
.page.active { display:block; }

/* ── SECTION LABEL ── */
.section-label {
  font-family:var(--mono); font-size:11px; color:var(--text2);
  letter-spacing:.1em; margin-bottom:8px;
  display:flex; align-items:center; gap:8px;
}
.section-label::after { content:''; flex:1; height:1px; background:var(--border); }

/* ── STAT CARDS ── */
.stat-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
.stat-card {
  background:var(--bg2); border:1px solid var(--border); border-radius:12px;
  padding:12px 14px;
}
.stat-label { font-size:10px; color:var(--text2); margin-bottom:4px; letter-spacing:.05em; }
.stat-val { font-family:var(--mono); font-size:18px; font-weight:700; }
.stat-sub { font-family:var(--mono); font-size:10px; color:var(--text2); margin-top:2px; }

/* ── TICKER CARD ── */
.ticker-card {
  background:var(--bg2); border:1px solid var(--border); border-radius:12px;
  margin-bottom:8px; overflow:hidden; transition:border-color .2s;
}
.ticker-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 14px; cursor:pointer;
}
.ticker-sym { font-family:var(--mono); font-size:13px; font-weight:700; color:var(--accent); }
.ticker-name { font-size:11px; color:var(--text2); }
.ticker-right { display:flex; align-items:center; gap:8px; }
.ticker-price { font-family:var(--mono); font-size:14px; font-weight:500; }
.lot-badge { font-size:10px; color:var(--text2); background:var(--bg3); padding:2px 7px; border-radius:10px; font-family:var(--mono); }
.chevron { color:var(--text2); font-size:10px; transition:transform .2s; }
.ticker-card.open .chevron { transform:rotate(180deg); }
.ticker-body { display:none; border-top:1px solid var(--border); }
.ticker-card.open .ticker-body { display:block; }

.lot-row { padding:10px 14px; border-bottom:1px solid var(--border); }
.lot-row:last-child { border-bottom:none; }
.lot-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
.lot-meta { display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
.lot-id { font-family:var(--mono); font-size:11px; color:var(--text2); }
.tag { font-size:9px; padding:2px 6px; border-radius:4px; background:var(--bg3); color:var(--accent2); border:1px solid var(--accent2); }
.tag.yellow { color:var(--yellow); border-color:var(--yellow); }
.tag.star { color:var(--yellow); border-color:transparent; background:transparent; font-size:11px; }
.lot-pnl { font-family:var(--mono); font-size:13px; font-weight:700; }
.lot-grid { display:grid; grid-template-columns:1fr 1fr; gap:4px 12px; margin-bottom:4px; }
.lot-item { display:flex; flex-direction:column; }
.li-label { font-size:9px; color:var(--text2); text-transform:uppercase; letter-spacing:.05em; }
.li-val { font-family:var(--mono); font-size:12px; }
.stop-line { font-size:10px; color:var(--red); font-family:var(--mono); margin-top:4px; line-height:1.4; }
.stop-meta { font-size:10px; color:var(--text2); font-family:var(--mono); margin-top:2px; line-height:1.4; }

.pos { color:var(--green); }
.neg { color:var(--red); }
.neu { color:var(--text2); }

/* ── TRADE LOG ── */
.filter-row { display:flex; gap:6px; margin-bottom:12px; overflow-x:auto; padding-bottom:4px; }
.filter-btn {
  background:var(--bg3); border:1px solid var(--border); color:var(--text2);
  font-family:var(--sans); font-size:11px; padding:5px 12px; border-radius:20px;
  cursor:pointer; white-space:nowrap; transition:all .2s; flex-shrink:0;
}
.filter-btn.active { background:var(--accent2); color:white; border-color:var(--accent2); }

.sym-search-wrap { position:relative; margin-bottom:10px; }
.sym-search-input {
  width:100%; background:var(--bg3); border:1px solid var(--border); color:var(--text);
  font-family:var(--mono); font-size:12px; padding:8px 12px; border-radius:10px;
  outline:none; transition:border-color .2s;
}
.sym-search-input:focus { border-color:var(--accent); }
.sym-search-input::placeholder { color:var(--text2); }
.sym-ac-list {
  position:absolute; top:100%; left:0; right:0; z-index:50;
  background:var(--bg2); border:1px solid var(--border); border-radius:10px;
  margin-top:4px; max-height:180px; overflow-y:auto; display:none;
}
.sym-ac-list.show { display:block; }
.sym-ac-item {
  padding:9px 12px; font-family:var(--mono); font-size:12px; color:var(--text);
  cursor:pointer; border-bottom:1px solid var(--border);
}
.sym-ac-item:last-child { border-bottom:none; }
.sym-ac-item:active { background:var(--bg3); }
.sym-ac-item .match { color:var(--accent); font-weight:700; }

.trade-card {
  background:var(--bg2); border:1px solid var(--border); border-radius:12px;
  margin-bottom:8px; overflow:hidden;
}
.trade-header { display:flex; justify-content:space-between; align-items:center; padding:10px 14px; cursor:pointer; }
.trade-sym { font-family:var(--mono); font-size:12px; font-weight:700; color:var(--accent); }
.trade-date { font-size:10px; color:var(--text2); font-family:var(--mono); }
.trade-pnl { font-family:var(--mono); font-size:14px; font-weight:700; }
.trade-body { display:none; border-top:1px solid var(--border); padding:10px 14px; }
.trade-card.open .trade-body { display:block; }
.trade-card.open .chevron { transform:rotate(180deg); }
.trade-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px 12px; }
.trade-type-badge {
  display:inline-block; font-size:9px; padding:2px 7px; border-radius:4px; margin-top:6px;
  font-family:var(--mono);
}
.type-손절 { background:rgba(255,68,102,.15); color:var(--red); border:1px solid var(--red); }
.type-판단청산 { background:rgba(0,212,255,.1); color:var(--accent); border:1px solid var(--accent); }
.type-익절 { background:rgba(0,255,136,.1); color:var(--green); border:1px solid var(--green); }
.exit-section { border-top:1px solid var(--border); }
.exit-row { padding:9px 14px; border-bottom:1px solid var(--border); background:rgba(0,0,0,.15); }
.exit-row:last-of-type { border-bottom:none; }
.exit-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:5px; }
.exit-label { font-family:var(--mono); font-size:10px; color:var(--text2); }
.exit-pnl { font-family:var(--mono); font-size:13px; font-weight:700; }
.exit-grid { display:grid; grid-template-columns:1fr 1fr; gap:3px 12px; }
.remain-row { display:flex; align-items:center; justify-content:space-between; padding:9px 14px; border-top:1px solid var(--border); }
.remain-badge { font-family:var(--mono); font-size:11px; padding:3px 10px; border-radius:8px; }
.remain-open { background:rgba(0,212,255,.1); color:var(--accent); border:1px solid var(--accent); }
.remain-done { background:rgba(136,136,170,.1); color:var(--text2); border:1px solid var(--border); }
.exit-add-btn { font-family:var(--sans); font-size:11px; background:var(--accent2); color:white; border:none; border-radius:8px; padding:6px 14px; cursor:pointer; }
.trade-action-btns { display:flex; gap:6px; margin-top:8px; padding-top:8px; border-top:1px solid var(--border); }
.trade-act-btn {
  flex:1; padding:8px; border:1px solid var(--border); border-radius:8px;
  font-family:var(--sans); font-size:11px; font-weight:700; cursor:pointer;
  background:var(--bg3); color:var(--text2); transition:all .2s;
}
.trade-act-btn:active { opacity:.7; }
.trade-act-btn.edit { color:var(--accent); border-color:var(--accent); }
.trade-act-btn.del { color:var(--red); border-color:var(--red); }
.edit-modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:500; display:flex; align-items:flex-end; }
.edit-modal {
  background:var(--bg2); border:1px solid var(--border); border-radius:20px 20px 0 0;
  padding:20px 16px; width:100%; max-height:80vh; overflow-y:auto;
}
.edit-modal-title { font-family:var(--mono); font-size:13px; color:var(--accent); margin-bottom:14px; }
.edit-field-row { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.edit-field-label { font-size:10px; color:var(--text2); width:70px; flex-shrink:0; text-transform:uppercase; letter-spacing:.05em; }
.edit-field-input {
  flex:1; background:var(--bg3); border:1px solid var(--border); color:var(--text);
  font-family:var(--mono); font-size:13px; padding:9px 11px; border-radius:8px; outline:none;
}
.edit-field-input:focus { border-color:var(--accent); }
.exit-modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:500; display:flex; align-items:flex-end; }
.exit-modal { background:var(--bg2); border:1px solid var(--border); border-radius:20px 20px 0 0; padding:20px 16px; width:100%; }
.exit-modal-title { font-family:var(--mono); font-size:13px; color:var(--accent); margin-bottom:14px; }
.exit-modal-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
.em-group { display:flex; flex-direction:column; gap:4px; }
.em-label { font-size:10px; color:var(--text2); text-transform:uppercase; letter-spacing:.05em; }
.em-input { background:var(--bg3); border:1px solid var(--border); color:var(--text); font-family:var(--mono); font-size:13px; padding:9px 11px; border-radius:8px; outline:none; width:100%; }
.em-input:focus { border-color:var(--accent); }
.em-select { background:var(--bg3); border:1px solid var(--border); color:var(--text); font-family:var(--sans); font-size:13px; padding:9px 11px; border-radius:8px; outline:none; width:100%; }
.exit-modal-btns { display:flex; gap:8px; }
.em-btn { flex:1; padding:13px; border:none; border-radius:10px; font-size:14px; font-weight:700; font-family:var(--sans); cursor:pointer; }
.em-btn.confirm { background:var(--accent); color:var(--bg); }
.em-btn.cancel { background:var(--bg3); color:var(--text2); border:1px solid var(--border); }

/* ── STATS PAGE ── */
.stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px; }
.stats-card {
  background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:14px;
}
.stats-card.full { grid-column:1/-1; }
.sc-title { font-size:10px; color:var(--text2); letter-spacing:.05em; margin-bottom:8px; text-transform:uppercase; }
.sc-val { font-family:var(--mono); font-size:20px; font-weight:700; }
.sc-sub { font-family:var(--mono); font-size:10px; color:var(--text2); margin-top:2px; }
.bar-row { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.bar-label { font-size:11px; color:var(--text2); width:60px; flex-shrink:0; }
.bar-track { flex:1; height:6px; background:var(--bg3); border-radius:3px; overflow:hidden; }
.bar-fill { height:100%; border-radius:3px; background:var(--accent); transition:width .4s; }
.bar-fill.green { background:var(--green); }
.bar-fill.red { background:var(--red); }
.bar-val { font-family:var(--mono); font-size:10px; color:var(--text2); width:40px; text-align:right; flex-shrink:0; }

/* ── CHAT ── */
.chat-wrap { display:flex; flex-direction:column; height:calc(100dvh - 56px - 56px); padding:0; position:relative; }
.chat-msgs { flex:1; overflow-y:auto; padding:12px 16px; display:flex; flex-direction:column; gap:10px; }
.msg-wrap { display:flex; flex-direction:column; }
.msg-wrap.user { align-items:flex-end; }
.msg-wrap.ai { align-items:flex-start; }
.msg {
  max-width:88%; padding:10px 14px; border-radius:14px;
  font-size:13px; line-height:1.5; white-space:pre-wrap; word-break:break-word;
}
.msg.user { background:var(--accent2); color:white; border-bottom-right-radius:4px; }
.msg.ai {
  background:var(--bg3); border:1px solid var(--border); color:var(--text);
  border-bottom-left-radius:4px; font-family:var(--mono); font-size:12px;
}
.msg.system {
  align-self:center; background:transparent; color:var(--text2); font-size:11px;
  border:1px dashed var(--border); border-radius:8px; text-align:center; max-width:100%;
}
.msg.ai pre {
  background:var(--bg); border:1px solid var(--border); border-radius:8px;
  padding:10px; overflow-x:auto; font-size:11px; margin-top:6px; white-space:pre;
}
/* 말풍선 컨텍스트 메뉴 */
.msg-ctx {
  position:fixed; z-index:9999;
  background:var(--bg2); border:1px solid var(--border); border-radius:10px;
  box-shadow:0 4px 20px rgba(0,0,0,.6); overflow:hidden;
  min-width:140px;
}
.msg-ctx-btn {
  display:block; width:100%; padding:12px 16px;
  background:none; border:none; border-bottom:1px solid var(--border);
  color:var(--text); font-family:var(--sans); font-size:13px;
  text-align:left; cursor:pointer;
}
.msg-ctx-btn:last-child { border-bottom:none; }
.msg-ctx-btn:active { background:var(--bg3); }
.msg-time { font-size:9px; color:var(--text2); margin-top:3px; font-family:var(--mono); }
.msg-imgs { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px; align-self:flex-end; }
.msg-img { width:80px; height:80px; object-fit:cover; border-radius:8px; border:1px solid var(--border); cursor:pointer; }
.loading-dots { display:flex; gap:4px; padding:12px 16px; align-self:flex-start; }
.dot { width:7px; height:7px; background:var(--accent); border-radius:50%; animation:bounce 1.2s infinite; }
.dot:nth-child(2) { animation-delay:.2s; }
.dot:nth-child(3) { animation-delay:.4s; }
@keyframes bounce { 0%,80%,100%{transform:translateY(0);opacity:.4} 40%{transform:translateY(-6px);opacity:1} }

.input-area {
  padding:10px 12px; background:rgba(10,10,15,.97); backdrop-filter:blur(12px);
  border-top:1px solid var(--border);
}
.img-previews { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px; padding:4px 0; }
.img-prev-wrap { position:relative; }
.img-prev { width:80px; height:80px; object-fit:cover; border-radius:12px; border:2px solid var(--accent); box-shadow:0 2px 8px rgba(0,0,0,.4); }
.img-prev:active { opacity:0.8; }
.img-rm {
  position:absolute; top:-6px; right:-6px; background:var(--red); color:white;
  border:none; border-radius:50%; width:18px; height:18px; font-size:10px;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.input-row { display:flex; gap:8px; align-items:flex-end; }
.icon-btn {
  background:var(--bg3); border:1px solid var(--border); color:var(--text2);
  width:40px; height:40px; border-radius:10px; font-size:18px;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:all .2s; flex-shrink:0;
}
.icon-btn:active { background:var(--border); transform:scale(.95); }
.icon-btn.send { background:var(--accent); border-color:var(--accent); color:var(--bg); font-weight:700; }
.icon-btn.send:disabled { opacity:.4; }
.text-input {
  flex:1; background:var(--bg3); border:1px solid var(--border); color:var(--text);
  font-family:var(--sans); font-size:14px; padding:10px 14px; border-radius:12px;
  resize:none; outline:none; min-height:40px; max-height:120px; overflow-y:auto;
  line-height:1.4; transition:border-color .2s;
}
.text-input:focus { border-color:var(--accent); }
.text-input::placeholder { color:var(--text2); }

/* ── SETTINGS ── */
.settings-wrap { padding:0 0 20px; }
.s-section { margin-bottom:20px; }
.s-title { font-family:var(--mono); font-size:13px; color:var(--accent); margin-bottom:4px; }
.s-desc { font-size:11px; color:var(--text2); margin-bottom:10px; line-height:1.6; }
.s-label { font-size:10px; color:var(--text2); letter-spacing:.08em; margin-bottom:5px; text-transform:uppercase; }
.s-input {
  width:100%; background:var(--bg3); border:1px solid var(--border); color:var(--text);
  font-family:var(--mono); font-size:13px; padding:11px 13px; border-radius:10px;
  outline:none; margin-bottom:10px; transition:border-color .2s;
}
.s-input:focus { border-color:var(--accent); }
.s-textarea {
  width:100%; background:var(--bg3); border:1px solid var(--border); color:var(--text);
  font-family:var(--mono); font-size:11px; line-height:1.6; padding:11px 13px;
  border-radius:10px; outline:none; resize:none; min-height:240px;
  transition:border-color .2s;
}
.s-textarea:focus { border-color:var(--accent2); }
.s-btn {
  width:100%; background:var(--accent); color:var(--bg); border:none;
  border-radius:10px; padding:13px; font-size:14px; font-weight:700;
  font-family:var(--sans); cursor:pointer; transition:opacity .2s; margin-bottom:8px;
}
.s-btn:active { opacity:.8; }
.s-btn.red { background:var(--red); }
.s-btn.dim { background:var(--bg3); color:var(--text2); border:1px solid var(--border); }
.s-status { font-family:var(--mono); font-size:11px; text-align:center; margin-top:4px; }
.s-status.ok { color:var(--green); }
.s-status.err { color:var(--red); }
.s-toolbar { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
.s-tool-btn {
  background:var(--bg3); border:1px solid var(--border); color:var(--text2);
  font-family:var(--sans); font-size:11px; padding:5px 11px; border-radius:8px; cursor:pointer;
}
.s-badge { font-family:var(--mono); font-size:11px; color:var(--green); }
.divider { height:1px; background:var(--border); margin:20px 0; }

/* history modal */
.modal-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:999;
  display:flex; align-items:flex-end;
}
.modal-inner {
  background:var(--bg2); border:1px solid var(--border);
  border-radius:20px 20px 0 0; padding:20px 16px; width:100%;
}
.modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.modal-title { font-family:var(--mono); font-size:13px; color:var(--accent); }
.modal-close { background:none; border:none; color:var(--text2); font-size:20px; cursor:pointer; }
.history-item {
  background:var(--bg3); border:1px solid var(--border); border-radius:8px;
  padding:10px 12px; margin-bottom:8px; cursor:pointer;
}
.hi-time { font-family:var(--mono); font-size:10px; color:var(--text2); margin-bottom:3px; }
.hi-preview { font-family:var(--mono); font-size:11px; color:var(--text); overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }

::-webkit-scrollbar { width:4px; }

    <button class="filter-btn" data-filter="진행중" onclick="toggleFilter(this)">진행중</button>
    <button class="filter-btn" data-filter="완료" onclick="toggleFilter(this)">완료</button>

    <input type="text" class="sym-search-input" id="symSearchInput" placeholder="종목명 검색..." oninput="onSymSearch(this.value)" onfocus="onSymSearch(this.value)" autocomplete="off" data-lpignore="true" data-form-type="other">
    <div class="sym-ac-list" id="symAcList"></div>
  </div>
  <div style="margin-bottom:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
    <select class="em-select" id="tradeYearFilter" style="width:auto;padding:5px 10px;font-size:11px;" onchange="tradeYear=this.value;renderTrades()">

    <select class="em-select" id="tradeDateBasis" style="width:auto;padding:5px 10px;font-size:11px;" onchange="tradeDateBasis=this.value;renderTrades()">

      <option value="청산일">청산일</option>
    </select>
    <select class="em-select" id="tradeSortSelect" style="width:auto;padding:5px 10px;font-size:11px;" onchange="tradeSort=this.value;renderTrades()">
      <option value="번호순">번호순</option>
      <option value="진입일순">진입일순</option>
      <option value="청산일순">청산일순</option>
      <option value="종목별">종목별</option>
    </select>
    <button class="filter-btn" onclick="exportFilteredTrades()" style="margin-left:auto;font-size:10px;padding:5px 10px;">📤 내보내기</button>
  </div>
  <div id="tradeList"></div>
</div>

<!-- ════ PAGE: 통계 ════ -->
<div class="page" id="page-stats">

</div>

<!-- ════ PAGE: 설정 ════ -->
<div class="page" id="page-settings">
  <div class="settings-wrap">

    <div class="s-section">
      <div class="s-title">📋 DB 업데이트 (붙여넣기 또는 파일 첨부)</div>
      <div class="s-desc">Claude에서 출력한 JSON을 붙여넣거나, .json 파일을 첨부하세요.<br>다른 데이터는 건드리지 않습니다.</div>
      
      <div class="s-label">포트폴리오 JSON</div>
      <textarea class="s-textarea" id="pastePortfolio" autocomplete="off" data-form-type="other" style="min-height:100px;" placeholder='{"us":[...],"kr":[...]} 형식의 JSON 붙여넣기'></textarea>
      <div style="display:flex;gap:8px;margin-top:6px;">
        <button class="s-btn" style="flex:1;margin:0;" onclick="pasteApplyPortfolio()">적용</button>
        <button class="s-btn dim" style="flex:1;margin:0;" onclick="document.getElementById('filePortfolio').click()">📎 파일</button>
      </div>
      <input type="file" id="filePortfolio" accept=".json" style="display:none" onchange="loadJsonFile(event,'portfolio')">
      <button class="s-btn red" id="portfolioUndoBtn" style="margin-top:6px;display:none;" onclick="undoPortfolio()">↩️ 되돌리기</button>
      <div class="s-status" id="pastePortfolioStatus"></div>

      <input type="file" id="fileTrades" accept=".json" style="display:none" onchange="loadJsonFile(event,'trades')">

• 포폴 일반 출력은 코드블럭 금지
• 한 줄 과밀 출력 금지
• Lot 수치 줄바꿈 고정:
  평단 | 수익률
  비중 | 노출도
• 손절가에는 손절유형과 래칫 여부를 함께 표시
• 무결성 체크는 이상 있을 때만 출력

════════════════════════
■ 상세 계산 과정 출력 조건
════════════════════════
평소에는 생략.
단, 아래 경우에는 출력:
• 새 차트 데이터/새 현재가/새 이평선 반영
• 손절 재계산
• 신규 체결
• 청산
• 오류 검증, NaN, 수량 불일치, lotId 충돌, JSON 복구

════════════════════════
■ 평단 표시
════════════════════════
• 전체평단은 증권사 계좌 기준 유지
• Lot 평단은 체결가 기준 표시
• 백업 역산 보정 평단은 포폴 화면에 표시하지 않음

════════════════════════
■ 계산 로직
════════════════════════
• 수익률: (현재가-평단)/평단*100
• 기계적손절가:
  비레버 → 평단*0.9
  2배레버 → 평단*0.8
  3배레버 → 평단*0.7
• 20일선손절가:
  비레버 → 20일선*0.98
  레버 → 본주 기준 환산 공식

════════════════════════
■ 레버 이동평균선 환산
════════════════════════
1) 본주이평선*0.98 = 기준가
2) 기준가/본주현재가-1 = 괴리율
3) 레버손절가 = 레버현재가*(1+(괴리율*레버배수))

════════════════════════
■ 실사용손절가 계산
════════════════════════
MIN(20일선환산손절가, 기계적손절가) → 둘 중 낮은 가격 사용
단, 한 번 올라간 손절선은 절대 내리지 않음
기존 래칫선이 있으면 신규 계산값이 낮아도 기존선 유지

════════════════════════
■ 차트 스샷 기준
════════════════════════
• 팝업 상단 이평 5/10/20 = SMA
• 팝업 하단 이평 5/10/20 = EMA

════════════════════════
■ 익절 규칙
════════════════════════
• 익절 없음
• 손절선 이탈 시 전량 손절`;

let _currentPage = 'portfolio';
function switchPage(name, btn) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  btn.classList.add('active');
  if(name==='portfolio') renderPortfolio();
  if(name==='trades')    renderTrades();
  if(name==='stats')     renderStats();
  if(name !== _currentPage) {
    history.pushState({page: name}, '', '');
    _currentPage = name;
  }
}
window.addEventListener('popstate', function(e) {
  // 이미지 모달이 열려있으면 닫기 (앱 종료 안 함)
  const modal = document.getElementById('imgModal');
  if(modal && modal.dataset.open === 'true') {
    closeImgModal();
    return;
  }
  if(e.state && e.state.modal === 'imgModal') {
    // 모달 열기 state인데 모달이 닫혀있으면 무시
    return;
  }
  if(e.state && e.state.page) {
    const btn = document.querySelector(`.nav-btn[onclick*="${e.state.page}"]`);
    if(btn) {
      document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
      document.getElementById('page-'+e.state.page).classList.add('active');
      btn.classList.add('active');
      _currentPage = e.state.page;
      if(e.state.page==='portfolio') renderPortfolio();
      if(e.state.page==='trades')    renderTrades();
      if(e.state.page==='stats')     renderStats();
    }
  } else {
    // 더 이상 이전 탭 없으면 앱 최소화 (홈으로)
    history.pushState(null, '', '');
  }
});

function pct(cur,avg){ return ((cur-avg)/avg*100); }
function fmtPct(v){ const n=parseFloat(v); return `<span class="${n>0?'pos':n<0?'neg':'neu'}">${n>0?'+':''}${n.toFixed(2)}%</span>`; }
function fmtP(v,kr){ return kr?Number(v).toLocaleString('ko-KR'):Number(v).toFixed(2); }

function renderPortfolio() {
  const usN=portfolio.us.length, krN=portfolio.kr.length;
  document.getElementById('topSub').textContent=`총 ${usN+krN}종목 · US ${usN} / KR ${krN}`;
  let h='';
  h+=renderMarket('🇺🇸 US MARKET', portfolio.us, false);
  h+=renderMarket('🇰🇷 KR MARKET', portfolio.kr, true);
  document.getElementById('portfolioList').innerHTML=h;
}

    h+=`<div class="ticker-card" id="tc${label.replace(/\s/g,'')}${ti}">
      <div class="ticker-header" onclick="toggleCard(this)">
        <div><div class="ticker-sym">${t.sym}</div><div class="ticker-name">${t.name}</div></div>
        <div class="ticker-right">

          <div class="lot-badge">×${t.lots.length}</div>
          <div class="chevron">▼</div>
        </div>
      </div>
      <div class="ticker-body">`;
    t.lots.forEach(lot=>{
      const p=pct(t.price,lot.avg);
      const pc2=p>0?'pos':p<0?'neg':'neu';
      h+=`<div class="lot-row">
        <div class="lot-top">
          <div class="lot-meta">
            <span class="lot-id">${String(lot.id).startsWith('Lot')?'':'Lot'}${lot.id}/${lot.qty}주</span>
            ${lot.star?`<span class="tag star">★${lot.note||''}</span>`:''}
            ${lot.tag?`<span class="tag">${lot.tag}</span>`:''}
            ${lot.entryGap?`<span class="tag yellow">괴리율${lot.entryGap}</span>`:''}
          </div>
          <div class="lot-pnl ${pc2}">${p>0?'+':''}${p.toFixed(2)}%</div>
        </div>
        <div class="lot-grid">
          <div class="lot-item"><span class="li-label">평단</span><span class="li-val">${fmtP(lot.avg,kr)}</span></div>
          <div class="lot-item"><span class="li-label">현재가</span><span class="li-val">${fmtP(t.price,kr)}</span></div>
          ${(t.stop20||t.stop10)?`<div class="lot-item"><span class="li-label">${t.stop10?'10':'20'}일선손절</span><span class="li-val neg">${fmtP(t.stop20||t.stop10,kr)}</span></div>`:''}
          ${lot.tp?`<div class="lot-item"><span class="li-label">익절가</span><span class="li-val pos">${fmtP(lot.tp,kr)}</span></div>`:''}
        </div>

        ${(lot.stopType||lot.ratchet)?`<div class="stop-meta">${lot.stopType?`유형 ${lot.stopType}`:''}${lot.stopType&&lot.ratchet?' · ':''}${lot.ratchet?`래칫 ${lot.ratchet}`:''}</div>`:''}

    });
    h+=`</div></div>`;
  });
  return h+'</div>';
}

]);
function calcTradingDays(entryStr, exitStr, market) {
  if(!entryStr||!exitStr) return null;
  try {
    const hols = market==='KR' ? _KR_HOL : _US_HOL;
    let d = new Date(entryStr+'T00:00:00'); d.setDate(d.getDate()+1);
    const end = new Date(exitStr+'T00:00:00');
    let cnt=0;
    while(d<=end){ const dow=d.getDay(), ds=d.toISOString().slice(0,10); if(dow!==0&&dow!==6&&!hols.has(ds)) cnt++; d.setDate(d.getDate()+1); }
    return Math.max(1,cnt);
  } catch(e){ return null; }
}

// ═══════════════════════════════════════════════
// MIGRATION: flat → exits[] structure
// ═══════════════════════════════════════════════
function migrateTrade(t) {
  if(t.exits !== undefined) {
    if('tag' in t) delete t.tag;
    return t;
  }
  const rec = {
    sym:t.sym, market:t.market,
    lotId:t.lotId||null, entryDate:t.entryDate||null,
    entryPrice:t.entryPrice, qty:Number(t.qty),
    entryGap:t.entryGap||null, stopDist:t.stopDist||null,
    weight:t.weight||t.posSize||null, memo:t.memo||'',
    exits:[], remainQty:Number(t.qty)
  };
  if(t.exitPrice||t.exitDate) {
    const hd = calcTradingDays(t.entryDate,t.exitDate,t.market) || t.holdDays || null;
    const pnl = t.pnl!=null?t.pnl:(t.returnPct!=null?t.returnPct:null);
    rec.exits=[{ exitDate:t.exitDate||null, exitQty:Number(t.qty), exitPrice:t.exitPrice,
      pnl:pnl, holdDays:hd, rVal:t.rVal||null, type:t.type||t.exitType||null, memo:'' }];
    rec.remainQty=0;
  }
  return rec;
}

// ═══════════════════════════════════════════════
// TRADE LOG RENDER
// ═══════════════════════════════════════════════
function applyTradeFilters(allMig){
  let filtered = allMig;
  if(!tradeFilter.has('전체')){
    filtered = allMig.filter(t=>{
      for(const f of tradeFilter){
        if(f==='진행중' && !(t.remainQty>0)) return false;
        if(f==='완료' && !(t.remainQty<=0)) return false;
        if(f==='손절' && !t.exits.some(e=>e.type==='손절')) return false;
        if(f==='판단청산' && !t.exits.some(e=>e.type==='판단청산')) return false;
        if(f==='US' && t.market!=='US') return false;
        if(f==='KR' && t.market!=='KR') return false;
      }
      return true;
    });
  }
  if(tradeSymSearch){
    const q = tradeSymSearch.toLowerCase();
    filtered = filtered.filter(t=>(t.sym||'').toLowerCase().includes(q));
  }
  return filtered;
}

function toggleFilter(btn) {
  const f = btn.dataset.filter;
  if(f==='전체'){
    tradeFilter = new Set(['전체']);
    document.querySelectorAll('#tradeFilters .filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
  } else {
    tradeFilter.delete('전체');
    document.querySelector('#tradeFilters .filter-btn[data-filter="전체"]').classList.remove('active');
    if(tradeFilter.has(f)){
      tradeFilter.delete(f);
      btn.classList.remove('active');
    } else {
      tradeFilter.add(f);
      btn.classList.add('active');
    }
    if(!tradeFilter.size){
      tradeFilter = new Set(['전체']);
      document.querySelector('#tradeFilters .filter-btn[data-filter="전체"]').classList.add('active');
    }
  }
  renderTrades();
}

function onSymSearch(val){
  tradeSymSearch = val.trim();
  const acList = document.getElementById('symAcList');
  if(!tradeSymSearch){ acList.classList.remove('show'); renderTrades(); return; }
  const allSyms = [...new Set(trades.map(t=>t.sym).filter(Boolean))];
  const q = tradeSymSearch.toLowerCase();
  const matches = allSyms.filter(s=>s.toLowerCase().includes(q));
  if(matches.length){
    acList.innerHTML = matches.map(s=>{
      const idx = s.toLowerCase().indexOf(q);
      const before = s.slice(0,idx);
      const match = s.slice(idx, idx+q.length);
      const after = s.slice(idx+q.length);
      return `<div class="sym-ac-item" onmousedown="selectSym('${s}')">${before}<span class="match">${match}</span>${after}</div>`;
    }).join('');
    acList.classList.add('show');
  } else {
    acList.classList.remove('show');
  }
  renderTrades();
}

function selectSym(sym){
  document.getElementById('symSearchInput').value = sym;
  tradeSymSearch = sym;
  document.getElementById('symAcList').classList.remove('show');
  renderTrades();
}

// 자동완성 외부 클릭 시 닫기
document.addEventListener('click', e=>{

  if(wrap && !wrap.contains(e.target)){
    document.getElementById('symAcList').classList.remove('show');
  }
});

function renderTrades() {
  const allMig = trades.map(migrateTrade);

  // 연도 옵션 업데이트
  const years=new Set();
  allMig.forEach(t=>{
    if(t.entryDate) years.add(t.entryDate.slice(0,4));
    (t.exits||[]).forEach(e=>{ if(e.exitDate) years.add(e.exitDate.slice(0,4)); });
  });
  const yearSel=document.getElementById('tradeYearFilter');
  if(yearSel){
    const sorted=['전체',...[...years].sort().reverse()];
    yearSel.innerHTML=sorted.map(y=>`<option value="${y}" ${y===tradeYear?'selected':''}>${y==='전체'?'전체 연도':y+'년'}</option>`).join('');
  }

  let filtered = applyTradeFilters(allMig);

  // 연도 필터: tradeDateBasis에 따라 진입일 또는 청산일 기준
  if(tradeYear!=='전체'){
    filtered=filtered.filter(t=>{
      if(tradeDateBasis==='청산일'){
        return t.exits.some(e=>e.exitDate&&e.exitDate.startsWith(tradeYear));
      } else {
        return t.entryDate&&t.entryDate.startsWith(tradeYear);
      }
    });
  }

  if(!filtered.length) {
    document.getElementById('tradeList').innerHTML=`<div class="msg system" style="margin-top:40px;display:block;text-align:center;">매매기록 없음</div>`;
    return;
  }

  const isKrFn = t=>t.market==='KR';
  const fmtV = (v,isKr)=>v==null?'-':(isKr?Number(v).toLocaleString('ko-KR'):Number(v).toFixed(2));

  let sorted;
  if(tradeSort==='진입일순'){
    sorted=[...filtered].sort((a,b)=>(b.entryDate||'').localeCompare(a.entryDate||''));
  } else if(tradeSort==='청산일순'){
    sorted=[...filtered].sort((a,b)=>{
      const aLast = a.exits.length ? a.exits.reduce((m,e)=>e.exitDate>m?e.exitDate:m,'') : '';
      const bLast = b.exits.length ? b.exits.reduce((m,e)=>e.exitDate>m?e.exitDate:m,'') : '';
      if(!aLast && !bLast) return 0;
      if(!aLast) return 1;
      if(!bLast) return -1;
      return bLast.localeCompare(aLast);
    });
  } else if(tradeSort==='종목별'){
    sorted=[...filtered].sort((a,b)=>{
      const symCmp=(a.sym||'').localeCompare(b.sym||'');
      if(symCmp!==0) return symCmp;
      return (a.entryDate||'').localeCompare(b.entryDate||'');
    });
  } else {
    sorted=[...filtered].reverse();
  }
  let h='';
  sorted.forEach((t,i)=>{
    const tradeNo = allMig.indexOf(t)+1;
    const isKr = isKrFn(t);
    const isOpen = t.remainQty>0;
    const rawIdx = trades.indexOf(trades.find((_,ri)=>ri===allMig.indexOf(t)));

    let sumPnl=null;
    if(t.exits.length){
      const tq=t.exits.reduce((a,e)=>a+Number(e.exitQty||0),0);
      const wp=t.exits.reduce((a,e)=>a+(parseFloat(e.pnl||0)*Number(e.exitQty||0)),0);
      sumPnl=tq?wp/tq:null;
    }
    const pc=sumPnl==null?'neu':sumPnl>0?'pos':sumPnl<0?'neg':'neu';
    const sign=sumPnl>0?'+':'';

    h+=`<div class="trade-card" id="trd${i}">
      <div class="trade-header" onclick="toggleTrade(this)">
        <div>
          <div class="trade-sym"><span style="font-size:10px;color:var(--text2);font-family:var(--mono);margin-right:5px;">#${tradeNo}</span>${t.sym}${t.lotId?`<span style="font-size:10px;color:var(--text2);margin-left:5px;">${t.lotId}</span>`:''}
          </div>
          <div class="trade-date">${t.entryDate||'-'}${t.market?` · ${t.market}`:''}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="remain-badge ${isOpen?'remain-open':'remain-done'}">${isOpen?t.remainQty+'주':'완료'}</span>
          ${sumPnl!=null?`<div class="trade-pnl ${pc}">${sign}${sumPnl.toFixed(2)}%</div>`:''}
          <div class="chevron">▼</div>
        </div>
      </div>
      <div class="trade-body">
        <div class="trade-grid" style="margin-bottom:8px;">

        ${t.exits.length?`<div class="exit-section">`+t.exits.map((e,ei)=>{

}

let _exitTargetIdx = null;
function openExitModal(migIdx) {
  _exitTargetIdx = migIdx;
  const t = migrateTrade(trades[migIdx]);
  document.getElementById('emQty').value = t.remainQty;
  document.getElementById('emPrice').value = '';
  document.getElementById('emDate').value = new Date().toISOString().slice(0,10);
  document.getElementById('emType').value = '판단청산';
  document.getElementById('emMemo').value = '';
  document.getElementById('exitModal').style.display='flex';
}
function closeExitModal() { document.getElementById('exitModal').style.display='none'; _exitTargetIdx=null; }
function confirmExit() {
  if(_exitTargetIdx===null) return;
  const exitQty = parseInt(document.getElementById('emQty').value);
  const exitPrice = parseFloat(document.getElementById('emPrice').value);
  const exitDate = document.getElementById('emDate').value;
  const type = document.getElementById('emType').value;
  const memo = document.getElementById('emMemo').value.trim();
  if(!exitQty||!exitPrice||!exitDate){ alert('수량, 청산가, 청산일은 필수입니다.'); return; }

  const t = migrateTrade(trades[_exitTargetIdx]);
  if(exitQty > t.remainQty){ alert(`잔여수량(${t.remainQty})보다 많습니다.`); return; }

  const pnl = ((exitPrice - Number(t.entryPrice)) / Number(t.entryPrice) * 100);
  const holdDays = calcTradingDays(t.entryDate, exitDate, t.market);
  const stopDistNum = t.stopDist ? parseFloat(t.stopDist) : null;
  const rVal = stopDistNum ? parseFloat((pnl / stopDistNum).toFixed(2)) : null;

  t.exits.push({ exitDate, exitQty, exitPrice, pnl:parseFloat(pnl.toFixed(2)), holdDays, rVal, type, memo });
  t.remainQty -= exitQty;
  trades[_exitTargetIdx] = t;
  saveTrades();
  renderTrades();
  closeExitModal();
}

        <div class="edit-field-row"><span class="edit-field-label">청산가</span><input class="edit-field-input" id="ef_exit${ei}_price" type="text" value="${e.exitPrice||''}"></div>

          </select></div>

function closeEditModal(){
  const el=document.getElementById('editModal');
  if(el) el.remove();
  _editTargetIdx=null;
}

function confirmEdit(){
  if(_editTargetIdx===null) return;
  const t = migrateTrade(trades[_editTargetIdx]);
  editFields.forEach(f=>{
    const el=document.getElementById('ef_'+f.key);
    if(!el) return;
    let v = el.value;
    if(f.key==='qty'||f.key==='entryPrice'){
      v = f.key==='qty'?parseInt(v):parseFloat(v);
      if(isNaN(v)) return;
    }
    t[f.key]=v;
  });
  // exits 업데이트
  t.exits.forEach((e,ei)=>{
    const dEl=document.getElementById('ef_exit'+ei+'_date');
    const pEl=document.getElementById('ef_exit'+ei+'_price');
    const qEl=document.getElementById('ef_exit'+ei+'_qty');
    const tEl=document.getElementById('ef_exit'+ei+'_type');
    const mEl=document.getElementById('ef_exit'+ei+'_memo');
    if(dEl) e.exitDate=dEl.value;
    if(pEl) e.exitPrice=parseFloat(pEl.value)||e.exitPrice;
    if(qEl) e.exitQty=parseInt(qEl.value)||e.exitQty;
    if(tEl) e.type=tEl.value;
    if(mEl) e.memo=mEl.value;
    // pnl, rVal 재계산
    if(t.entryPrice && e.exitPrice){
      e.pnl=parseFloat(((e.exitPrice-Number(t.entryPrice))/Number(t.entryPrice)*100).toFixed(2));
    }
    if(e.exitDate && t.entryDate){
      e.holdDays=calcTradingDays(t.entryDate,e.exitDate,t.market);
    }
    if(t.stopDist && e.pnl!=null){
      const sd=parseFloat(t.stopDist);
      e.rVal=sd?parseFloat((e.pnl/sd).toFixed(2)):null;
    }
  });
  // remainQty 재계산
  const exitedQty = t.exits.reduce((a,e)=>a+Number(e.exitQty||0),0);
  t.remainQty = Number(t.qty) - exitedQty;
  trades[_editTargetIdx]=t;
  saveTrades();
  renderTrades();
  closeEditModal();
}

function deleteTrade(migIdx){
  const t = migrateTrade(trades[migIdx]);
  if(!confirm(`#${migIdx+1} ${t.sym} ${t.lotId||''} 을(를) 삭제할까요?`)) return;
  trades.splice(migIdx,1);
  saveTrades();
  renderTrades();
}

function deleteExit(migIdx,exitIdx){
  const t = migrateTrade(trades[migIdx]);
  if(!confirm(`${t.sym} ${exitIdx+1}차 청산을 삭제할까요?`)) return;
  const removedQty = Number(t.exits[exitIdx].exitQty||0);
  t.exits.splice(exitIdx,1);
  t.remainQty = Number(t.qty) - t.exits.reduce((a,e)=>a+Number(e.exitQty||0),0);
  trades[migIdx]=t;
  saveTrades();
  renderTrades();
  closeEditModal();
}

// STATS RENDER

let statsFilter='전체';
let statsYear='전체';
let statsMonth='전체';
let statsMarket='전체';

function renderStats() {
  const el=document.getElementById('statsContent');
  const allMig=trades.map(migrateTrade);
  
  // 모든 exits 수집 (부모 trade 정보 포함)
  let allExits=[];
  allMig.forEach(t=>{
    (t.exits||[]).forEach(e=>allExits.push({
      ...e, sym:t.sym, market:t.market, entryPrice:t.entryPrice, entryDate:t.entryDate,
      entryGap:t.entryGap, stopDist:t.stopDist, weight:t.weight, lotId:t.lotId, qty:t.qty
    }));
  });

  // 연도/월 옵션 수집
  const years=new Set(), months=new Set();
  allExits.forEach(e=>{
    if(e.exitDate){ years.add(e.exitDate.slice(0,4)); months.add(e.exitDate.slice(0,7)); }
  });
  const sortedYears=['전체',...[...years].sort().reverse()];
  const sortedMonths=['전체',...[...months].sort().reverse()];

  // 필터 적용
  let filtered=allExits;
  if(statsYear!=='전체') filtered=filtered.filter(e=>e.exitDate&&e.exitDate.startsWith(statsYear));
  if(statsMonth!=='전체') filtered=filtered.filter(e=>e.exitDate&&e.exitDate.startsWith(statsMonth));
  if(statsMarket!=='전체') filtered=filtered.filter(e=>e.market===statsMarket);

  // 필터 UI
  let filterHTML=`<div style="display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px;">
    <select class="em-select" style="width:auto;padding:5px 10px;font-size:11px;" onchange="statsYear=this.value;statsMonth='전체';renderStats()">
      ${sortedYears.map(y=>`<option value="${y}" ${y===statsYear?'selected':''}>${y==='전체'?'전체 연도':y+'년'}</option>`).join('')}
    </select>
    <select class="em-select" style="width:auto;padding:5px 10px;font-size:11px;" onchange="statsMonth=this.value;renderStats()">
      ${sortedMonths.map(m=>`<option value="${m}" ${m===statsMonth?'selected':''}>${m==='전체'?'전체 월':m}</option>`).join('')}
    </select>
    <select class="em-select" style="width:auto;padding:5px 10px;font-size:11px;" onchange="statsMarket=this.value;renderStats()">
      <option value="전체" ${statsMarket==='전체'?'selected':''}>전체</option>
      <option value="US" ${statsMarket==='US'?'selected':''}>US</option>
      <option value="KR" ${statsMarket==='KR'?'selected':''}>KR</option>
    </select>
  </div>`;

  if(!filtered.length) {
    el.innerHTML=filterHTML+`<div class="msg system" style="margin-top:40px;display:block;text-align:center;">청산 기록 없음</div>`;
    return;
  }

  const n=filtered.length;
  const pnls=filtered.map(e=>parseFloat(e.pnl||0));
  const wins=pnls.filter(p=>p>0);
  const losses=pnls.filter(p=>p<=0);
  const winRate=(wins.length/n*100).toFixed(1);
  const lossRate=(losses.length/n*100).toFixed(1);
  const avgPnl=(pnls.reduce((a,b)=>a+b,0)/n).toFixed(2);
  const medPnl=median(pnls).toFixed(2);
  const avgWin=wins.length?(wins.reduce((a,b)=>a+b,0)/wins.length).toFixed(2):'0';
  const avgLoss=losses.length?(losses.reduce((a,b)=>a+b,0)/losses.length).toFixed(2):'0';
  const plRatio=Math.abs(parseFloat(avgLoss))>0?(parseFloat(avgWin)/Math.abs(parseFloat(avgLoss))).toFixed(2):'N/A';
  const expectancy=(parseFloat(winRate)/100*parseFloat(avgWin)+parseFloat(lossRate)/100*parseFloat(avgLoss)).toFixed(2);
  const maxWin=Math.max(...pnls).toFixed(2);
  const maxLoss=Math.min(...pnls).toFixed(2);
  const maxWinTrade=filtered[pnls.indexOf(Math.max(...pnls))];
  const maxLossTrade=filtered[pnls.indexOf(Math.min(...pnls))];

  // R값
  const rVals=filtered.filter(e=>e.rVal!=null).map(e=>parseFloat(e.rVal));
  const avgR=rVals.length?(rVals.reduce((a,b)=>a+b,0)/rVals.length).toFixed(2):'N/A';
  const medR=rVals.length?median(rVals).toFixed(2):'N/A';

  // 손절거리
  const stopDists=filtered.filter(e=>e.stopDist).map(e=>parseFloat(e.stopDist));
  const avgStopDist=stopDists.length?(stopDists.reduce((a,b)=>a+b,0)/stopDists.length).toFixed(1):'N/A';

  // 청산유형
  const 손절cnt=filtered.filter(e=>e.type==='손절').length;
  const 판단cnt=filtered.filter(e=>e.type==='판단청산').length;
  const 익절cnt=filtered.filter(e=>e.type==='익절').length;

  // 연속 승패
  let maxConsecWin=0,maxConsecLoss=0,cw=0,cl=0;
  pnls.forEach(p=>{
    if(p>0){cw++;cl=0;maxConsecWin=Math.max(maxConsecWin,cw);}
    else{cl++;cw=0;maxConsecLoss=Math.max(maxConsecLoss,cl);}
  });

  // 보유기간
  const holdDays=filtered.filter(e=>e.holdDays).map(e=>Number(e.holdDays));
  const avgHold=holdDays.length?(holdDays.reduce((a,b)=>a+b,0)/holdDays.length).toFixed(1):'N/A';
  const shortTerm=filtered.filter(e=>e.holdDays&&e.holdDays<=5);
  const midTerm=filtered.filter(e=>e.holdDays&&e.holdDays>5&&e.holdDays<=20);
  const longTerm=filtered.filter(e=>e.holdDays&&e.holdDays>20);
  const avgPnlShort=shortTerm.length?(shortTerm.reduce((a,e)=>a+parseFloat(e.pnl||0),0)/shortTerm.length).toFixed(2):'N/A';
  const avgPnlMid=midTerm.length?(midTerm.reduce((a,e)=>a+parseFloat(e.pnl||0),0)/midTerm.length).toFixed(2):'N/A';
  const avgPnlLong=longTerm.length?(longTerm.reduce((a,e)=>a+parseFloat(e.pnl||0),0)/longTerm.length).toFixed(2):'N/A';

  // 종목별 손익
  const symMap={};
  filtered.forEach(e=>{
    if(!symMap[e.sym]) symMap[e.sym]={pnls:[],cnt:0};
    symMap[e.sym].pnls.push(parseFloat(e.pnl||0));
    symMap[e.sym].cnt++;
  });
  const symRank=Object.entries(symMap).map(([s,d])=>({
    sym:s, avg:(d.pnls.reduce((a,b)=>a+b,0)/d.cnt).toFixed(2), total:d.pnls.reduce((a,b)=>a+b,0).toFixed(2), cnt:d.cnt
  })).sort((a,b)=>parseFloat(b.total)-parseFloat(a.total));

  // US vs KR
  const usExits=filtered.filter(e=>e.market==='US');
  const krExits=filtered.filter(e=>e.market==='KR');
  const usAvg=usExits.length?(usExits.reduce((a,e)=>a+parseFloat(e.pnl||0),0)/usExits.length).toFixed(2):'N/A';
  const krAvg=krExits.length?(krExits.reduce((a,e)=>a+parseFloat(e.pnl||0),0)/krExits.length).toFixed(2):'N/A';

  // 레버 vs 비레버 (심볼명에 레버리지/2X/3X 포함 여부)
  const isLever=s=>/레버|2X|3X|LEVER/i.test(s);
  const levExits=filtered.filter(e=>isLever(e.sym));
  const nonLevExits=filtered.filter(e=>!isLever(e.sym));
  const levAvg=levExits.length?(levExits.reduce((a,e)=>a+parseFloat(e.pnl||0),0)/levExits.length).toFixed(2):'N/A';
  const nonLevAvg=nonLevExits.length?(nonLevExits.reduce((a,e)=>a+parseFloat(e.pnl||0),0)/nonLevExits.length).toFixed(2):'N/A';

  // 월별 손익 추이 차트 데이터
  const monthlyPnl={};
  filtered.forEach(e=>{
    if(!e.exitDate) return;
    const m=e.exitDate.slice(0,7);
    if(!monthlyPnl[m]) monthlyPnl[m]={total:0,cnt:0};
    monthlyPnl[m].total+=parseFloat(e.pnl||0);
    monthlyPnl[m].cnt++;
  });
  const monthKeys=Object.keys(monthlyPnl).sort();
  const maxMonthAbs=Math.max(...monthKeys.map(k=>Math.abs(monthlyPnl[k].total)),1);

  // R값 분포
  const rBuckets={'<-2':0,'-2~-1':0,'-1~0':0,'0~1':0,'1~2':0,'>2':0};
  rVals.forEach(r=>{
    if(r<-2) rBuckets['<-2']++;
    else if(r<-1) rBuckets['-2~-1']++;
    else if(r<0) rBuckets['-1~0']++;
    else if(r<1) rBuckets['0~1']++;
    else if(r<2) rBuckets['1~2']++;
    else rBuckets['>2']++;
  });
  const maxRBucket=Math.max(...Object.values(rBuckets),1);

  // 산점도 데이터: 손절거리 vs 수익률
  const scatterGap=filtered.filter(e=>e.stopDist&&e.pnl!=null).map(e=>({
    x:parseFloat(String(e.stopDist).replace('%','')),
    y:parseFloat(e.pnl)
  }));

  // 산점도 데이터: 보유기간 vs 수익률
  const scatterHold=filtered.filter(e=>e.holdDays&&e.pnl!=null).map(e=>({

function median(arr){
  if(!arr.length) return 0;
  const s=[...arr].sort((a,b)=>a-b);
  const m=Math.floor(s.length/2);
  return s.length%2?s[m]:(s[m-1]+s[m])/2;
}

function drawScatter(canvasId, data, xLabel, yLabel){
  const canvas=document.getElementById(canvasId);
  if(!canvas||!data.length) return;
  const ctx=canvas.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const w=canvas.clientWidth, h=canvas.clientHeight;
  canvas.width=w*dpr; canvas.height=h*dpr;
  ctx.scale(dpr,dpr);

  const pad={top:10,right:10,bottom:25,left:40};
  const pw=w-pad.left-pad.right, ph=h-pad.top-pad.bottom;

  const xs=data.map(d=>d.x), ys=data.map(d=>d.y);
  const xMin=Math.min(...xs), xMax=Math.max(...xs);
  const yMin=Math.min(...ys), yMax=Math.max(...ys);
  const xRange=xMax-xMin||1, yRange=yMax-yMin||1;

  // 0 line
  const zeroY=pad.top+ph*(1-(0-yMin)/yRange);
  ctx.strokeStyle='rgba(136,136,170,.3)';
  ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(pad.left,zeroY); ctx.lineTo(pad.left+pw,zeroY); ctx.stroke();

  // dots
  data.forEach(d=>{
    const x=pad.left+(d.x-xMin)/xRange*pw;
    const y=pad.top+ph*(1-(d.y-yMin)/yRange);
    ctx.beginPath();
    ctx.arc(x,y,3,0,Math.PI*2);
    ctx.fillStyle=d.y>=0?'rgba(0,255,136,.7)':'rgba(255,68,102,.7)';
    ctx.fill();
  });

  // labels
  ctx.fillStyle='#8888aa';
  ctx.font='9px JetBrains Mono';
  ctx.textAlign='center';
  ctx.fillText(xLabel,pad.left+pw/2,h-3);
  ctx.save();
  ctx.translate(10,pad.top+ph/2);
  ctx.rotate(-Math.PI/2);
  ctx.fillText(yLabel,0,0);
  ctx.restore();

  // axis values
  ctx.textAlign='right';
  ctx.fillText(yMax.toFixed(0),pad.left-4,pad.top+8);
  ctx.fillText(yMin.toFixed(0),pad.left-4,pad.top+ph);
  ctx.textAlign='left';
  ctx.fillText(xMin.toFixed(0),pad.left,h-14);
  ctx.textAlign='right';
  ctx.fillText(xMax.toFixed(0),pad.left+pw,h-14);
}

function _downloadJSON(data, prefix) {
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=`${prefix}_${new Date().toISOString().slice(0,10)}.json`; a.click();
  URL.revokeObjectURL(url);
}
function _importJSON(cb) {
  const input=document.createElement('input'); input.type='file'; input.accept='.json';
  input.onchange=e=>{
    const file=e.target.files[0]; if(!file) return;
    const r=new FileReader();
    r.onload=ev=>{ try { cb(JSON.parse(ev.target.result)); } catch(err){alert('❌ 파일 오류: '+err.message);} };
    r.readAsText(file);
  };
  input.click();
}

    const clean=[], exitAdded=[], dupSkip=[], conflicts=[];
    let memoUpdated=0, metadataUpdated=0, metadataFieldUpdated=0;
    const isBlank=v=>v===undefined||v===null||v==='';
    const fillEmpty=(target, source, key)=>{
      if(!isBlank(source[key]) && isBlank(target[key])){
        target[key]=source[key];
        metadataFieldUpdated++;
        return true;
      }
      return false;
    };

    newArr.forEach(nw=>{
      // 완성된 flat 기록(진입+청산 세트) vs 순수 청산 추가 구분
      // exitQty 있으면 → 순수 청산 추가
      // exitPrice 있지만 entryPrice+qty도 있으면 → 완성된 flat 기록 (진입으로 처리)
      const isPureExit = !!(nw.exitQty);
      const isCompleteFlat = !nw.exitQty && !!(nw.exitPrice) && !!(nw.entryPrice) && !!(nw.qty);
      const isExitRecord = isPureExit; // 완성된 flat은 진입 기록으로 처리

      // ── 진입 기록 ──
      if(!isExitRecord){
        // 1차: 완전 일치 (entryDate 포함)
        let match = existing.find(ex=>
          ex.sym===nw.sym &&
          (ex.entryDate??null)===(nw.entryDate??null) &&
          numEq(ex.entryPrice, nw.entryPrice) &&
          Number(ex.qty)===Number(nw.qty)
        );
        // 2차: 기존 entryDate가 null이고 나머지 동일 → 기존 기록 업데이트
        if(!match && nw.entryDate){
          match = existing.find(ex=>
            ex.sym===nw.sym &&
            !ex.entryDate &&
            numEq(ex.entryPrice, nw.entryPrice) &&
            Number(ex.qty)===Number(nw.qty)
          );
          if(match){
            const idx=existing.indexOf(match);
            let changed=false;
            ['entryDate','entryGap','stopDist','weight','lotId','market','totalAmt'].forEach(key=>{
              if(fillEmpty(existing[idx],nw,key)) changed=true;
            });
            if(changed) metadataUpdated++;
            if(nw.memo && nw.memo!==existing[idx].memo){
              existing[idx].memo = existing[idx].memo ? existing[idx].memo+' / '+nw.memo : nw.memo;
              memoUpdated++;
            }
            dupSkip.push(nw);
            return;
          }
        }
        // 3차: lotId 기준 매칭 (sym+lotId+entryPrice 동일, entryDate 무관)
        if(!match && nw.lotId){
          match = existing.find(ex=>
            ex.sym===nw.sym &&
            String(ex.lotId)===String(nw.lotId) &&
            numEq(ex.entryPrice, nw.entryPrice)
          );
        }
        if(match){
          const idx=existing.indexOf(match);
          let changed=false;
          ['entryDate','entryGap','stopDist','weight','lotId','market','totalAmt'].forEach(key=>{
            if(fillEmpty(existing[idx],nw,key)) changed=true;
          });
          if(changed) metadataUpdated++;
          if(nw.memo && nw.memo!==existing[idx].memo){
            existing[idx].memo = existing[idx].memo ? existing[idx].memo+' / '+nw.memo : nw.memo;
            memoUpdated++;
          }
          dupSkip.push(nw);
        } else {
          clean.push(migrateTrade(nw));
        }
        return;
      }

      // ── 청산 기록 ──
      // 매칭: lotId > sym+entryDate+entryPrice > sym+entryDate 순
      let target = null;
      if(nw.lotId){
        target = existing.find(ex=>ex.sym===nw.sym && String(ex.lotId)===String(nw.lotId) && ex.remainQty>0);
      }
      if(!target && nw.entryDate && nw.entryPrice){
        target = existing.find(ex=>ex.sym===nw.sym && ex.entryDate===nw.entryDate && numEq(ex.entryPrice,nw.entryPrice) && ex.remainQty>0);
      }
      if(!target && nw.entryDate){
        const cands = existing.filter(ex=>ex.sym===nw.sym && ex.entryDate===nw.entryDate && ex.remainQty>0);
        if(cands.length===1) target=cands[0];
      }
      if(!target){
        // 진입일 없으면 sym+진입가로 미청산 중 가장 먼저 진입한 것
        const cands = existing.filter(ex=>ex.sym===nw.sym && ex.remainQty>0);
        if(nw.entryPrice) target=cands.find(ex=>numEq(ex.entryPrice,nw.entryPrice));
        if(!target && cands.length===1) target=cands[0];
      }
      if(!target){ conflicts.push({reason:'매칭 실패',nw}); return; }

      const exitQty = Number(nw.exitQty||nw.qty||0);
      const exitPrice = Number(nw.exitPrice);
      const exitDate = nw.exitDate||null;
      const type = nw.type||nw.exitType||null;
      const entryPrice = Number(target.entryPrice);
      const pnl = entryPrice ? parseFloat(((exitPrice-entryPrice)/entryPrice*100).toFixed(2)) : null;
      const holdDays = calcTradingDays(target.entryDate, exitDate, target.market);
      const stopDistNum = target.stopDist ? parseFloat(target.stopDist) : null;
      const rVal = (stopDistNum&&pnl!=null) ? parseFloat((pnl/stopDistNum).toFixed(2)) : null;

      if(exitQty > target.remainQty){ conflicts.push({reason:`청산수량(${exitQty}) > 잔여(${target.remainQty})`,nw}); return; }

      const idx=existing.indexOf(target);
      existing[idx].exits.push({ exitDate, exitQty, exitPrice, pnl, holdDays, rVal, type, memo:nw.memo||'' });
      existing[idx].remainQty -= exitQty;
      exitAdded.push(nw);
    });

    if(conflicts.length){
      let msg='⚠️ 처리 불가 '+conflicts.length+'건:\n\n';
      conflicts.forEach(c=>{ msg+=`${c.nw.sym||''}: ${c.reason}\n`; });
      alert(msg); setStatus('pasteTradesStatus','❌ 처리 불가 '+conflicts.length+'건','err'); return;
    }

    if(dupSkip.length && !clean.length && !exitAdded.length && !memoUpdated && !metadataUpdated){
      setStatus('pasteTradesStatus','ℹ️ 추가할 새 기록 없음 (전부 중복)','ok'); return;
    }

    trades = existing;
    trades.push(...clean);
    saveTrades(); renderTrades();
    document.getElementById('pasteTrades').value='';
    let msg='✅ ';
    if(clean.length) msg+=`진입 ${clean.length}건 추가`;
    if(exitAdded.length) msg+=(clean.length?' / ':'')+`청산 ${exitAdded.length}건 반영`;
    if(metadataUpdated) msg+=` / 기존 Lot ${metadataUpdated}건 보완(${metadataFieldUpdated}개 필드)`;
    if(memoUpdated) msg+=` / 메모 ${memoUpdated}건`;
    const pureDup=Math.max(0,dupSkip.length-metadataUpdated-memoUpdated);
    if(pureDup) msg+=` / 중복 ${pureDup}건 건너뜀`;
    msg+=` (총 ${trades.length}건)`;
    setStatus('pasteTradesStatus',msg,'ok');
  }catch(e){
    setStatus('pasteTradesStatus','❌ JSON 파싱 오류: '+e.message,'err');
  }
}
// ── JSON 파일 첨부 ──
function loadJsonFile(e, type){
  const file=e.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=function(ev){
    const text=ev.target.result;
    if(type==='portfolio'){
      document.getElementById('pastePortfolio').value=text;
      pasteApplyPortfolio();
    } else if(type==='trades'){
      document.getElementById('pasteTrades').value=text;
      // 파일 첨부는 추가 모드로 동작
      pasteAppendTrades();
    }
  };
  reader.readAsText(file);
  e.target.value='';
}

function detectPlatform() {
  const ua=navigator.userAgent;
  const el=document.getElementById('installGuide');
  if(/Android/.test(ua)) el.innerHTML='📱 <b>Android 설치</b><br>Chrome 우상단 메뉴(⋮) → "홈 화면에 추가"';
  else if(/iPhone|iPad/.test(ua)) el.innerHTML='📱 <b>iOS 설치</b><br>Safari 공유(□↑) → "홈 화면에 추가"';
  else el.innerHTML='모바일 Chrome 또는 Safari에서 열어주세요.';
  renderArchiveBtns();
}

// ── Merge Restore ──
function mergeRestoreTrades(){
  _importJSON(data=>{
    let incoming=data.trades||data;
    if(!Array.isArray(incoming)){alert('매매기록 배열이 없습니다');return;}
    if(!confirm(`Merge 복구: ${incoming.length}건을 기존 기록에 병합합니다.\nsym+lotId 기준 매칭 → 일치하면 덮어씀, 없으면 추가, 기존에만 있으면 유지`)) return;
    
    let existing=trades.map(migrateTrade);
    let updated=0, added=0;
    
    incoming.forEach(raw=>{
      const nw=migrateTrade(raw);
      // sym+lotId 매칭
      const idx=existing.findIndex(ex=>ex.sym===nw.sym && String(ex.lotId)===String(nw.lotId));
      if(idx>=0){
        // 덮어씀
        existing[idx]=nw;
        updated++;
      } else {
        existing.push(nw);
        added++;
      }
    });
    
    trades=existing;
    saveTrades();
    renderTrades();
    alert(`✅ Merge 완료: ${updated}건 업데이트, ${added}건 추가 (총 ${trades.length}건)`);
  });
}

// ── 연도별 아카이브 ──
function renderArchiveBtns(){
  const el=document.getElementById('archiveBtns');
  if(!el) return;
  const years=new Set();
  trades.map(migrateTrade).forEach(t=>{
    (t.exits||[]).forEach(e=>{
      if(e.exitDate) years.add(e.exitDate.slice(0,4));
    });
  });
  const sorted=[...years].sort().reverse();
  if(!sorted.length){ el.innerHTML='<span style="font-size:11px;color:var(--text2);">청산 기록 없음</span>'; return; }
  el.innerHTML=sorted.map(y=>`
    <button class="s-btn dim" style="width:auto;padding:8px 12px;font-size:11px;margin:0;" onclick="archiveExport('${y}')">📤 ${y}년</button>
    <button class="s-btn dim" style="width:auto;padding:8px 12px;font-size:11px;margin:0;" onclick="archiveImport('${y}')">📥 ${y}년</button>
  `).join('');
}

function archiveExport(year){
  const allMig=trades.map(migrateTrade);
  const archived=allMig.filter(t=>{
    if(!t.exits||!t.exits.length) return false;
    if(t.remainQty>0) return false;
    return t.exits.every(e=>e.exitDate&&e.exitDate.startsWith(year));
  });
  if(!archived.length){ alert(`${year}년 청산완료 기록이 없습니다`); return; }
  _downloadJSON({trades:archived,exportedAt:new Date().toISOString(),archiveYear:year},`아카이브_${year}`);
  alert(`${year}년 청산완료 ${archived.length}건 백업 완료`);
}

function archiveImport(year){
  _importJSON(data=>{
    let incoming=data.trades||data;
    if(!Array.isArray(incoming)){alert('매매기록 배열이 없습니다');return;}
    if(!confirm(`${year}년 아카이브 ${incoming.length}건을 복원합니다.\n기존에 동일 Lot이 있으면 건너뜁니다.`)) return;
    
    let existing=trades.map(migrateTrade);
    let added=0, skipped=0;
    
    incoming.forEach(raw=>{
      const nw=migrateTrade(raw);
      const dup=existing.find(ex=>ex.sym===nw.sym && String(ex.lotId)===String(nw.lotId) && ex.entryDate===nw.entryDate);
      if(dup){ skipped++; return; }
      existing.push(nw);
      added++;
    });
    
    trades=existing;
    saveTrades();
    renderTrades();
    renderArchiveBtns();
    alert(`✅ ${year}년 아카이브 복원: ${added}건 추가, ${skipped}건 중복 건너뜀`);
  });
}

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
window.onload=()=>{
  portfolio=loadPortfolio();
  trades=loadTrades();
  // 자동 마이그레이션: flat→exits 변환 후 저장
  let migrated=false;
  trades=trades.map(t=>{
    if(t.exits!==undefined) {
      // tag 필드 제거
      if('tag' in t){ delete t.tag; migrated=true; }
      return t;
    }
    migrated=true;
    return migrateTrade(t);
  });
  if(migrated) saveTrades();
  renderPortfolio();
  detectPlatform();
};
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
